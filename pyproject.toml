[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networkbaseline"
version = "1.0.0"
description = "Lab tool that builds a normal traffic baseline and flags unusual sources, ports, and volume"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
network-baseline = "main:main"
